<body class="xm-body" data-backdrop="calm">
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__photo"></div>
    <div class="backdrop__vignette"></div>
    <div class="backdrop__glow"></div>
    <canvas class="backdrop__glitch"></canvas>
  </div>

  <a class="skip" href="#main">Skip to content</a>

  <div class="page">
    <header class="nav wrap" id="xm-nav">
      <a class="logo" href="app.html" aria-label="Primer, build a course">
        <svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M16 9.2c-3-2.3-7-2.7-11-1.6v16c4-1.1 8-.7 11 1.6 3-2.3 7-2.7 11-1.6v-16c-4-1.1-8-.7-11 1.6z"/><path d="M16 9.2v16"/></svg>
        Primer
      </a>
      <nav class="nav__links" aria-label="App">
        <a class="nav__link" href="community.html">Community</a>
        <a class="nav__link" href="app.html#library">My courses</a>
        <a class="nav__link" href="review.html">Review<span class="rvbadge" data-review-due hidden></span></a>
        <span class="user"><span class="user__name" data-user-name></span><button class="textlink" type="button" data-signout>Sign out</button></span>
      </nav>
    </header>

    <!-- the clock, while an exam is being taken -->
    <div class="xm-bar" id="xm-bar" hidden>
      <div class="xm-bar__inner">
        <div class="xm-bar__title"><span class="xm-bar__name" id="xm-bar-name"></span><span class="xm-bar__count" id="xm-bar-count"></span></div>
        <span class="xm-bar__saved" id="xm-bar-saved" aria-live="polite"></span>
        <span class="xm-timer" id="xm-timer" role="timer" aria-label="Time left"></span>
        <button class="btn btn--small" type="button" id="xm-bar-handin">Hand in</button>
      </div>
    </div>
    <p class="sr-only" id="xm-announce" aria-live="assertive"></p>

    <main id="main" class="wrap xm" tabindex="-1">
      <div id="xm-root" class="xm__root">
        <section class="paper xm-paper"><p class="xm-loading" role="status">Opening…</p></section>
      </div>
    </main>

    <footer class="foot wrap">
      <p>© 2026 Primer. Learn anything, credibly.</p>
    </footer>
  </div>
</body>
