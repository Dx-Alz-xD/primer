<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson | Primer</title>
<meta name="theme-color" content="#120b06">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23120b06'/%3E%3Ctext x='32' y='47' font-family='Georgia,serif' font-size='44' text-anchor='middle' fill='%23d6a554'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&family=Caveat:wght@400..600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/lesson.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script defer src="assets/js/core.js"></script>
<script defer src="assets/js/backdrop.js"></script>
<script defer src="assets/js/courses-data.js"></script>
<script defer src="assets/js/api.js"></script>
<script defer src="assets/js/doubts.js"></script>
<script defer src="assets/js/notebook.js"></script>
<script defer src="assets/js/lesson.js"></script>
</head>
<body data-backdrop="calm">
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__photo"></div>
    <div class="backdrop__vignette"></div>
    <div class="backdrop__glow"></div>
    <canvas class="backdrop__glitch"></canvas>
  </div>

  <a class="skip" href="#paper">Skip to the lesson</a>

  <div class="page">
    <header class="lbar">
      <div class="lbar__inner">
        <a class="logo logo--small" href="app.html" aria-label="Primer, your courses">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M16 9.2c-3-2.3-7-2.7-11-1.6v16c4-1.1 8-.7 11 1.6 3-2.3 7-2.7 11-1.6v-16c-4-1.1-8-.7-11 1.6z"/><path d="M16 9.2v16"/></svg>
          <span>Primer</span>
        </a>
        <a class="lbar__back" id="back-link" href="app.html">Course outline</a>
        <div class="lbar__title">
          <span class="lbar__course" id="lbar-course"></span>
          <span class="lbar__pos" id="lbar-pos"></span>
        </div>
        <div class="segs" id="segs" role="img" aria-label="Lesson progress"></div>
        <div class="lbar__tools">
          <button class="tool" type="button" id="wb-toggle" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l3.5-.8L19 7.7a2.1 2.1 0 0 0-3-3L3.8 17.2z"/><path d="M14.5 6.2l3 3"/></svg>
            <span class="tool__label">Whiteboard</span>
          </button>
          <button class="tool" type="button" id="nb-toggle" aria-expanded="false" aria-controls="notebook">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.8"/><path d="M9 3v18"/><path d="M12 8h4"/><path d="M12 12h4"/></svg>
            <span class="tool__label">Notebook</span>
          </button>
          <button class="tool" type="button" id="doubts-toggle" aria-expanded="false" aria-controls="doubts">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.4"/><path d="M12 16.6h.01"/></svg>
            <span class="tool__label">Doubts</span>
            <span class="tool__count" id="doubts-count" data-n="0"></span>
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="lesson-layout">
      <nav class="side" id="side" aria-label="Lessons in this course"></nav>
      <div class="lesson-col">
        <article class="paper" id="paper" tabindex="-1" aria-labelledby="lesson-title">
          <header class="lhead" id="lhead"></header>
          <div class="lbody" id="lbody"></div>
          <div class="llock" id="llock" hidden></div>
          <div class="ldone" id="ldone" hidden></div>
        </article>
        <nav class="lnav" id="lnav" aria-label="Previous and next lesson"></nav>
      </div>
    </main>
  </div>

  <!-- whiteboard tools -->
  <div class="wb-bar" id="wb-bar" role="toolbar" aria-label="Whiteboard tools" hidden>
    <div class="wb-group">
      <button class="wb-btn" type="button" data-tool="pen" aria-pressed="true" aria-label="Pen" title="Pen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l3.5-.8L19 7.7a2.1 2.1 0 0 0-3-3L3.8 17.2z"/></svg>
      </button>
      <button class="wb-btn" type="button" data-tool="highlighter" aria-pressed="false" aria-label="Highlighter" title="Highlighter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14l-4 4v2h5l3-3"/><path d="M8.5 13.5l7-9 4 4-9 7z"/><path d="M4 21h16" opacity=".5"/></svg>
      </button>
      <button class="wb-btn" type="button" data-tool="eraser" aria-pressed="false" aria-label="Eraser" title="Eraser">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20h11"/><path d="M4.6 14.6l9-9a2 2 0 0 1 2.8 0l3 3a2 2 0 0 1 0 2.8L13 18H8.4z"/><path d="M9 10l5 5"/></svg>
      </button>
    </div>
    <div class="wb-group" role="group" aria-label="Pen colour">
      <button class="wb-swatch" type="button" data-color="#2b1d11" style="--c:#2b1d11" aria-pressed="true" aria-label="Ink"></button>
      <button class="wb-swatch" type="button" data-color="#9a3324" style="--c:#9a3324" aria-pressed="false" aria-label="Red"></button>
      <button class="wb-swatch" type="button" data-color="#2c4a7a" style="--c:#2c4a7a" aria-pressed="false" aria-label="Blue"></button>
      <button class="wb-swatch" type="button" data-color="#3d6a2c" style="--c:#3d6a2c" aria-pressed="false" aria-label="Green"></button>
    </div>
    <div class="wb-group">
      <button class="wb-text" type="button" data-act="undo">Undo</button>
      <button class="wb-text" type="button" data-act="clear">Clear</button>
    </div>
    <button class="btn" type="button" data-act="ask">Ask about this</button>
    <button class="wb-text" type="button" data-act="done">Done</button>
  </div>

  <!-- doubts drawer -->
  <aside class="drawer" id="doubts" role="dialog" aria-modal="true" aria-labelledby="doubts-title" hidden>
    <div class="drawer__head">
      <h2 id="doubts-title">Your doubts</h2>
      <button class="textlink" type="button" id="doubts-close">Close</button>
    </div>
    <p class="drawer__note">Doubts you ask in this lesson. Answers will appear here once the tutor is connected.</p>
    <ul class="drawer__list" id="doubts-list"></ul>
    <p class="drawer__empty" id="doubts-empty">No doubts yet. Select any text in the lesson, or sketch on the whiteboard, to ask one.</p>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
</body>
</html>
