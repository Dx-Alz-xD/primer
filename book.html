<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book | Primer</title>
<meta name="theme-color" content="#120b06">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23120b06'/%3E%3Ctext x='32' y='47' font-family='Georgia,serif' font-size='44' text-anchor='middle' fill='%23d6a554'%3EP%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/offline.css">
<link rel="stylesheet" href="assets/css/lesson.css">
<link rel="stylesheet" href="assets/css/book.css">
<link rel="stylesheet" href="assets/css/photos.css">
<link rel="stylesheet" href="assets/css/refs.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script defer src="assets/js/core.js"></script>
<script defer src="assets/js/i18n.js"></script>
<script defer src="assets/js/offline.js"></script>
<script defer src="assets/js/backdrop.js"></script>
<script defer src="assets/js/courses-data.js"></script>
<script defer src="assets/js/api.js"></script>
<script defer src="assets/js/photos.js"></script>
<script defer src="assets/js/zip.js"></script>
<script defer src="assets/js/refs.js"></script>
<script defer src="assets/js/book-content.js"></script>
<script defer src="assets/js/epub.js"></script>
<script defer src="assets/js/book.js"></script>
</head>
<body class="bk-body" data-backdrop="calm">
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__photo"></div>
    <div class="backdrop__vignette"></div>
    <div class="backdrop__glow"></div>
    <canvas class="backdrop__glitch"></canvas>
  </div>

  <a class="skip" href="#flow">Skip to the book</a>

  <div class="page">
    <header class="lbar">
      <div class="lbar__inner">
        <a class="logo logo--small" href="app.html" aria-label="Primer, your courses">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M16 9.2c-3-2.3-7-2.7-11-1.6v16c4-1.1 8-.7 11 1.6 3-2.3 7-2.7 11-1.6v-16c-4-1.1-8-.7-11 1.6z"/><path d="M16 9.2v16"/></svg>
          <span>Primer</span>
        </a>
        <a class="lbar__back" id="back-link" href="app.html">Course outline</a>
        <div class="lbar__title">
          <span class="lbar__course" id="bk-course"></span>
          <span class="lbar__pos" id="bk-pos"></span>
        </div>
        <div class="lbar__tools" id="bk-tools">
          <button class="tool" type="button" id="bk-contents" aria-label="Contents" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
            <span class="tool__label">Contents</span>
          </button>
          <button class="tool" type="button" id="bk-pdf" aria-label="Save as PDF" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="7.5" rx="1.6"/><path d="M7 14h10v6.5H7z"/></svg>
            <span class="tool__label">Save as PDF</span>
          </button>
          <button class="tool" type="button" id="bk-epub" aria-label="Download EPUB" data-epub disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v11.5"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4.5 20.5h15"/></svg>
            <span class="tool__label">Download EPUB</span>
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="bk-main">
      <div class="bk-stage" id="stage">
        <p class="bk-status" id="bk-status" role="status"><span class="bk-quill" aria-hidden="true"><i></i><i></i><i></i></span>Opening the book</p>
        <div class="spread" id="spread" hidden>
          <div class="sheet sheet--l" aria-hidden="true"><p class="runhead" id="run-l"></p><p class="folio" id="folio-l"></p></div>
          <div class="sheet sheet--r" aria-hidden="true"><p class="runhead" id="run-r"></p><p class="folio" id="folio-r"></p></div>
          <div class="viewport" id="viewport">
            <article class="flow" id="flow" tabindex="-1"></article>
          </div>
        </div>
      </div>
      <nav class="bk-controls" id="bk-controls" aria-label="Turn the pages" hidden>
        <button class="bk-turn" type="button" id="bk-prev" aria-label="Previous page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>
          <span class="bk-turn__label">Previous</span>
        </button>
        <div class="bk-progress">
          <div class="bk-bar" id="bk-bar" role="progressbar" aria-label="Reading progress" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1"><span></span></div>
          <p class="bk-where" id="bk-where" aria-live="polite"></p>
        </div>
        <button class="bk-turn bk-turn--next" type="button" id="bk-next" aria-label="Next page">
          <span class="bk-turn__label">Next</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
        </button>
      </nav>
    </main>
  </div>
</body>
</html>
